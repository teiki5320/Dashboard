<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Ce que la page a le droit de charger et de contacter. Tout vient du
         site lui-même : plus aucun domaine tiers depuis le retrait de la
         partie gestion (SheetJS ne servait qu'aux exports Excel). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
    <title>Dash</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0f10">
    <link rel="apple-touch-icon" href="assets/icon-180.png">
    <link rel="stylesheet" href="style.css">
    <script>
    // Thème avant le premier rendu : évite le flash clair/sombre.
    try { if (localStorage.getItem('gp-theme') === 'clair') document.documentElement.setAttribute('data-theme', 'clair'); } catch (e) {}
    </script>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

<div id="gp-shell">
<aside id="gp-rail">
    <img class="rail-logo" src="assets/dash-logo.png" alt="" onerror="this.onerror=null;this.src='assets/icon-192.png'">
    <nav>
        <button type="button" class="rail-item active" data-page="accueil" onclick="showPage('accueil')"><span class="ico">⌂</span><span class="lbl">Accueil</span></button>
        <button type="button" class="rail-item" data-page="dash" onclick="showPage('dash')"><span class="ico">📱</span><span class="lbl">Mes apps</span></button>
        <div id="rail-dash-slot"></div>
        <!-- Studio : les vidéos (pubs de mes applis — recettes dans Keur Cook —, chaînes).
             Le studio tourne sur le Mac ; on l'ouvre par son adresse protégée
             (Cloudflare Access, code par e-mail) : aucun secret ici. -->
        <a class="rail-item rail-studio" href="https://studio.toakeur.com/#/pub" target="_blank" rel="noopener" title="Studio — pubs de mes applis (et recettes Keur Cook)"><span class="ico">📣</span><span class="lbl">Publicité</span></a>
        <a class="rail-item rail-studio" href="https://studio.toakeur.com/#/chaine" target="_blank" rel="noopener" title="Studio — mes chaînes"><span class="ico">🎥</span><span class="lbl">Chaîne</span></a>
    </nav>
</aside>
<div id="gp-main">

<header>
    <!-- Pas de titre ici : le module affiche le sien, avec son sous-titre, son
         champ de recherche et sa cloche. Deux titres identiques l'un au-dessus
         de l'autre, c'était du bruit. -->
    <div class="hd-left">
        <button id="global-back" class="global-back-btn" onclick="goBack()" title="Retour" aria-label="Retour">←</button>
    </div>
    <div class="hd-clock">
        <button id="gp-theme" class="hd-btn" onclick="gpToggleTheme()" title="Clair / sombre" aria-label="Basculer le thème clair ou sombre">☀️</button>
        <button id="hd-anim-toggle" class="hd-anim-btn" onclick="toggleGlobalAnim()" title="Activer / couper les animations" aria-label="Activer ou couper les animations">⚡</button>
        <div class="hd-clock-text">
            <div id="hd-date">...</div>
            <div id="hd-time" style="font-size: 16px; color: var(--gold)">00:00</div>
        </div>
    </div>
</header>

<div id="toast-holder"></div>

<!-- Récupération des données de l'ancienne Gestion Pro : rempli par script.js
     seulement s'il en reste dans ce navigateur, et disparaît une fois vidé. -->
<div id="recup-anciennes" style="display:none"></div>

<!-- Page de garde : deux portes, rien d'autre. Mes apps est ici ; Publicité
     et Chaîne vivent dans le Studio, qui tourne sur le Mac et s'ouvre par son
     adresse protégée. -->
<div id="page-accueil" class="page active">
    <div class="garde">
        <button type="button" class="garde-tuile g-apps" onclick="showPage('dash')">
            <span class="garde-ico">📱</span>
            <span class="garde-nom">Mes apps</span>
            <span class="garde-sous" id="garde-apps-sous">mes applis et mes sites</span>
        </button>
        <div class="garde-tuile g-pub">
            <span class="garde-ico">📣</span>
            <span class="garde-nom">Publicité</span>
            <span class="garde-sous">les vidéos, dans le Studio</span>
            <span class="garde-liens">
                <a href="https://studio.toakeur.com/#/pub" target="_blank" rel="noopener">Publicité ↗</a>
                <a href="https://studio.toakeur.com/#/chaine" target="_blank" rel="noopener">Chaîne ↗</a>
            </span>
        </div>
    </div>
</div>

<div id="page-dash" class="page">
    <div id="dash-contenu"></div>
</div>

</div>
</div>

<script src="script.js"></script>
<script src="assets/dash-data.js"></script>
<script src="dash-module.js"></script>
<script>
// ── Thème clair / sombre (sombre par défaut, mémorisé) ──────────────────────
function gpTheme() {
    return document.documentElement.getAttribute('data-theme') === 'clair' ? 'clair' : 'sombre';
}
function gpApplyTheme(t) {
    if (t === 'clair') document.documentElement.setAttribute('data-theme', 'clair');
    else document.documentElement.removeAttribute('data-theme');
    try { localStorage.setItem('gp-theme', t); } catch (e) {}
    var b = document.getElementById('gp-theme');
    if (b) b.textContent = t === 'clair' ? '🌙' : '☀️';
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'clair' ? '#efe3d6' : '#0f0f10');
}
function gpToggleTheme() { gpApplyTheme(gpTheme() === 'clair' ? 'sombre' : 'clair'); }
gpApplyTheme(gpTheme());

// On arrive sur la page de garde ; Mes apps se charge au premier clic.
sousTitreDeGarde();
showPage('accueil');

// Mode hors-ligne (PWA) : inactif en file:// et sur les très vieux navigateurs.
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
}
</script>
</body>
</html>
